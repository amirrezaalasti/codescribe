name: Skill request
description: Request a new skill for the catalog
title: "[skill request] "
labels: ["skill-request"]
body:
  - type: input
    id: name
    attributes:
      label: Proposed skill name
      description: Lowercase, hyphens only (e.g. python-async)
      placeholder: my-new-skill
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - coding
        - writing
        - meta
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: When should the agent use this?
      description: Trigger scenarios and keywords
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should the skill teach?
      description: Key instructions, defaults, and anti-patterns
    validations:
      required: true
